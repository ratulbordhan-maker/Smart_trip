spring.application.name=smarttrip

# Server
server.port=8081

# Database - Development
spring.datasource.url=jdbc:mysql://localhost:3306/smarttrip
spring.datasource.username=smarttrip
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration - Development
jwt.secret=dev-secret-key-for-development-only-not-secure
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Logging
logging.level.root=INFO
logging.level.com.smarttrip.smarttrip=DEBUG
logging.level.org.springframework.security=DEBUG

# Frontend URL
app.frontend.url=http://localhost:3000
